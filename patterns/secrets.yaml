- name: aws_access_key
  entity: AwsAccessKey
  pattern: 'AKIA[0-9A-Z]{16}'
  confidence: 0.95
  validator: null
  description: "AWS access key ID starting with AKIA followed by 16 uppercase alphanumeric characters"

- name: aws_secret_key
  entity: AwsSecretKey
  pattern: '(?:aws_secret_access_key|aws_secret_key|secret_access_key|AWS_SECRET_ACCESS_KEY)\s*[:=]\s*[''"]?([A-Za-z0-9/+=]{40})[''"]?|(?:[:=]\s*|>\s*)[''"]?([A-Za-z0-9/+=]{40})[''"]?'
  confidence: 0.85
  validator: null
  description: "AWS secret access key, 40 characters of base64-like content after common prefixes or assignment operators"

- name: anthropic_api_key
  entity: AnthropicApiKey
  pattern: 'sk-ant-[a-zA-Z0-9_-]{20,}'
  confidence: 0.95
  validator: null
  description: "Anthropic API key starting with sk-ant- prefix"

- name: openai_api_key
  entity: OpenAiApiKey
  pattern: 'sk-(?:proj|live|test)[a-zA-Z0-9_-]{20,}'
  confidence: 0.95
  validator: null
  description: "OpenAI API key starting with sk-proj, sk-live, or sk-test"

- name: github_token
  entity: GitHubToken
  pattern: '(?:ghp|gho|ghs|ghr|github_pat)_[a-zA-Z0-9_]{36,}'
  confidence: 0.95
  validator: null
  description: "GitHub personal access token or fine-grained token"

- name: stripe_secret_key
  entity: StripeKey
  pattern: '(?:sk_live|rk_live)_[a-zA-Z0-9]{24,}'
  confidence: 0.95
  validator: null
  description: "Stripe live secret or restricted key"

- name: google_api_key
  entity: GoogleApiKey
  pattern: 'AIza[0-9A-Za-z_-]{35}'
  confidence: 0.90
  validator: null
  description: "Google API key starting with AIza"

- name: slack_token
  entity: SlackToken
  pattern: 'xox[bpas]-[0-9a-zA-Z-]{10,}'
  confidence: 0.95
  validator: null
  description: "Slack bot, user, or app token"

- name: jwt
  entity: Jwt
  pattern: 'eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]+'
  confidence: 0.90
  validator: null
  description: "JSON Web Token with three base64url-encoded segments"

- name: bearer_token
  entity: BearerToken
  pattern: '[Bb]earer\s+[a-zA-Z0-9_\-.~+/]+=*'
  confidence: 0.85
  validator: null
  description: "Bearer authentication token value in Authorization header"

- name: generic_secret
  entity: GenericSecret
  pattern: '(?:password|passwd|pwd|secret|token|api_key|apikey|api[-_]?secret)\s*[:=]\s*[''"]?([^\s''"]{8,})'
  confidence: 0.80
  validator: null
  description: "Generic password or secret in assignment context"

- name: ssh_private_key
  entity: SshPrivateKey
  pattern: '-----BEGIN\s+(?:RSA|DSA|EC|OPENSSH|ENCRYPTED)?\s*PRIVATE KEY-----'
  confidence: 0.99
  validator: null
  description: "SSH private key PEM block header"

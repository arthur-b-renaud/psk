# Secret / credential recognizers.
#
# These default to the reversible `Tokenize` redaction action (see psk-core policy): provider
# traffic only ever sees a `__PSK_<hex>__` token, while the real value can be restored into local
# file writes by the Claude Code PreToolUse hook. Tuned for recall — a false positive is harmless
# (it round-trips), a missed credential is the failure we prevent.

# --- AWS ---
- name: aws_access_key
  entity: AwsAccessKey
  pattern: '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|A3T[A-Z0-9])[0-9A-Z]{16}\b'
  confidence: 0.95
  description: "AWS access key ID (AKIA/ASIA/... prefix + 16 chars)"

- name: aws_secret_key
  entity: AwsSecretKey
  pattern: '(?:aws_secret_access_key|aws_secret_key|secret_access_key|AWS_SECRET_ACCESS_KEY)\s*[:=]\s*[''"]?([A-Za-z0-9/+=]{40})[''"]?'
  confidence: 0.9
  description: "AWS secret access key (40 base64-ish chars after a known assignment)"

- name: aws_session_token
  entity: AwsSessionToken
  pattern: '(?:aws_session_token|AWS_SESSION_TOKEN)\s*[:=]\s*[''"]?([A-Za-z0-9/+=]{100,})[''"]?'
  confidence: 0.9
  description: "AWS session token (long base64 blob after a known assignment)"

# --- AI / LLM providers ---
- name: anthropic_api_key
  entity: AnthropicApiKey
  pattern: 'sk-ant-[a-zA-Z0-9_-]{20,}'
  confidence: 0.97
  description: "Anthropic API key (sk-ant- prefix)"

- name: openai_api_key
  entity: OpenAiApiKey
  pattern: 'sk-(?:proj|live|test|svcacct)?-?[a-zA-Z0-9_-]{20,}'
  confidence: 0.9
  description: "OpenAI API key (sk-, sk-proj-, sk-svcacct-, ...)"

- name: huggingface_token
  entity: HuggingfaceToken
  pattern: '\bhf_[a-zA-Z0-9]{30,}\b'
  confidence: 0.95
  description: "Hugging Face access token (hf_ prefix)"

# --- Source forges ---
- name: github_token
  entity: GitHubToken
  pattern: '(?:ghp|gho|ghs|ghr|ghu|github_pat)_[a-zA-Z0-9_]{36,}'
  confidence: 0.97
  description: "GitHub personal access / fine-grained / OAuth token"

- name: gitlab_token
  entity: GitlabToken
  pattern: '\bglpat-[a-zA-Z0-9_-]{20,}\b'
  confidence: 0.95
  description: "GitLab personal access token (glpat- prefix)"

# --- Payments ---
- name: stripe_secret_key
  entity: StripeKey
  pattern: '(?:sk|rk)_(?:live|test)_[a-zA-Z0-9]{20,}'
  confidence: 0.95
  description: "Stripe live/test secret or restricted key"

# --- Google / GCP ---
- name: google_api_key
  entity: GoogleApiKey
  pattern: 'AIza[0-9A-Za-z_-]{35}'
  confidence: 0.92
  description: "Google API key (AIza prefix)"

- name: gcp_oauth_client_secret
  entity: GcpServiceAccountKey
  pattern: '\bGOCSPX-[a-zA-Z0-9_-]{20,}\b'
  confidence: 0.9
  description: "Google/GCP OAuth client secret (GOCSPX- prefix)"

# --- Messaging / comms ---
- name: slack_token
  entity: SlackToken
  pattern: 'xox[bpasr]-[0-9a-zA-Z-]{10,}'
  confidence: 0.95
  description: "Slack bot/user/app/refresh token"

- name: slack_webhook
  entity: SlackWebhook
  pattern: 'https://hooks\.slack\.com/services/T[0-9A-Z]+/B[0-9A-Z]+/[0-9a-zA-Z]+'
  confidence: 0.97
  description: "Slack incoming webhook URL"

- name: discord_bot_token
  entity: DiscordToken
  pattern: '\b[MNO][A-Za-z\d_-]{23,25}\.[\w-]{6}\.[\w-]{27,38}\b'
  confidence: 0.85
  description: "Discord bot token"

- name: discord_webhook
  entity: DiscordToken
  pattern: 'https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/\d+/[\w-]+'
  confidence: 0.97
  description: "Discord webhook URL"

- name: telegram_bot_token
  entity: TelegramBotToken
  pattern: '\b\d{8,10}:[A-Za-z0-9_-]{35}\b'
  confidence: 0.9
  description: "Telegram bot token (id:secret)"

- name: twilio_api_key
  entity: TwilioKey
  pattern: '\bSK[0-9a-fA-F]{32}\b'
  confidence: 0.9
  description: "Twilio API key SID (SK + 32 hex)"

- name: sendgrid_key
  entity: SendgridKey
  pattern: '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b'
  confidence: 0.97
  description: "SendGrid API key"

- name: mailgun_key
  entity: MailgunKey
  pattern: '\bkey-[0-9a-zA-Z]{32}\b'
  confidence: 0.85
  description: "Mailgun API key (key- prefix)"

# --- Package registries ---
- name: npm_token
  entity: NpmToken
  pattern: '\bnpm_[a-zA-Z0-9]{36}\b'
  confidence: 0.95
  description: "npm access token (npm_ prefix)"

- name: pypi_token
  entity: PypiToken
  pattern: '\bpypi-[A-Za-z0-9_-]{16,}\b'
  confidence: 0.95
  description: "PyPI upload token (pypi- prefix)"

# --- Cloud / infra / observability ---
- name: digitalocean_token
  entity: DigitaloceanToken
  pattern: '\bdo[oprv]_v1_[a-f0-9]{64}\b'
  confidence: 0.95
  description: "DigitalOcean personal access / OAuth / refresh token"

- name: cloudflare_token
  entity: CloudflareToken
  pattern: '(?:cf|cloudflare)[_-]?(?:api[_-]?)?token\s*[:=]\s*[''"]?([A-Za-z0-9_-]{40})[''"]?'
  confidence: 0.85
  description: "Cloudflare API token (40 chars after a known assignment)"

- name: datadog_api_key
  entity: DatadogKey
  pattern: '(?:dd|datadog)[_-]?api[_-]?key\s*[:=]\s*[''"]?([a-f0-9]{32})[''"]?'
  confidence: 0.85
  description: "Datadog API key (32 hex after a known assignment)"

- name: sentry_dsn
  entity: SentryDsn
  pattern: 'https://[0-9a-f]{32}@[a-z0-9.-]+\.ingest\.[a-z0-9.-]*sentry[a-z0-9.-]*/\d+'
  confidence: 0.95
  description: "Sentry DSN with embedded key"

- name: shopify_token
  entity: ShopifyToken
  pattern: '\bshp(?:at|ca|pa|ss)_[a-fA-F0-9]{32}\b'
  confidence: 0.95
  description: "Shopify access/custom/private/shared token"

# --- Generic / structural ---
- name: jwt
  entity: Jwt
  pattern: 'eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]+'
  confidence: 0.9
  description: "JSON Web Token (three base64url segments)"

- name: bearer_token
  entity: BearerToken
  pattern: '[Bb]earer\s+[a-zA-Z0-9_\-.~+/]{12,}=*'
  confidence: 0.85
  description: "Bearer authentication token value"

- name: generic_secret
  entity: GenericSecret
  pattern: '(?:password|passwd|pwd|secret|token|api_key|apikey|api[-_]?secret|access[-_]?token|client[-_]?secret|auth[-_]?token)\s*[:=]\s*[''"]?([^\s''"]{8,})'
  confidence: 0.8
  description: "Generic password/secret/token in an assignment context"

- name: ssh_private_key
  entity: SshPrivateKey
  pattern: '-----BEGIN\s+(?:RSA|DSA|EC|OPENSSH|ENCRYPTED)?\s*PRIVATE KEY-----'
  confidence: 0.99
  description: "SSH/TLS private key PEM block header"

- name: pgp_private_key
  entity: PgpPrivateKey
  pattern: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
  confidence: 0.99
  description: "PGP private key block header"

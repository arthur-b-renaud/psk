  confidence: 0.90
  validator: null
  description: "French mobile phone number starting with 06 or 07"

- name: phone_fr_landline
  entity: PhoneFr
  pattern: '(?:(?:\+33|0033)\s?|0)[1-5](?:[\s.-]?\d{2}){4}'
  confidence: 0.90
  validator: null
  description: "French landline phone number starting with 01-05"

- name: phone_us

- name: ipv4_address
  entity: Ipv4
  pattern: '\b(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\b'
  confidence: 0.8
  validator: null
  description: "IPv4 address. Lower confidence because IPs are common in code and logs."

- name: ipv6_address
  entity: Ipv6
  pattern: '\b(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}\b|::(?:[0-9a-fA-F]{1,4}:){0,5}[0-9a-fA-F]{1,4}\b|\b[0-9a-fA-F]{1,4}::(?:[0-9a-fA-F]{1,4}:){0,4}[0-9a-fA-F]{1,4}\b'
  confidence: 0.95
  validator: null
  description: "IPv6 address (full, compressed, and mixed forms)"

- name: mac_address
  entity: MacAddress
  pattern: '\b(?:[0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2}\b'
  confidence: 0.95
  validator: null
  description: "MAC address (colon or hyphen separated)"

- name: url_with_auth
  entity: UrlWithAuth
  pattern: 'https?://[^\s:@]+:[^\s:@]+@[^\s]+'
  confidence: 1.0
  validator: null
  description: "URL containing embedded authentication credentials (user:pass@host)"

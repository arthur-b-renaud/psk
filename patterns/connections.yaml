# Connection strings with embedded credentials.
#
# Each pattern requires a `user:password@host` shape so plain (credential-less) hostnames don't
# match. These carry secrets, so they default to the reversible `Tokenize` action.

- name: postgres_url
  entity: ConnectionString
  pattern: 'postgres(?:ql)?://[^:@\s/]+:[^@\s/]+@[^\s/]+'
  confidence: 0.95
  description: "PostgreSQL connection URL with embedded credentials"

- name: mysql_url
  entity: ConnectionString
  pattern: 'mysql://[^:@\s/]+:[^@\s/]+@[^\s/]+'
  confidence: 0.95
  description: "MySQL connection URL with embedded credentials"

- name: mongodb_url
  entity: ConnectionString
  pattern: 'mongodb(?:\+srv)?://[^:@\s/]+:[^@\s/]+@[^\s/]+'
  confidence: 0.95
  description: "MongoDB connection URL with embedded credentials"

- name: redis_url
  entity: ConnectionString
  pattern: 'rediss?://[^:@\s/]*:[^@\s/]+@[^\s/]+'
  confidence: 0.95
  description: "Redis connection URL with embedded password"

- name: amqp_url
  entity: ConnectionString
  pattern: 'amqps?://[^:@\s/]+:[^@\s/]+@[^\s/]+'
  confidence: 0.95
  description: "AMQP/RabbitMQ connection URL with embedded credentials"

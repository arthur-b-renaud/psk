[[rule]]
id = "linear-api-key"
pattern = "lin_api_[a-zA-Z0-9]{40}"
[[rule]]
id = "notion-api-token"
pattern = "ntn_[0-9]{11}[A-Za-z0-9]{35}"
[[rule]]
id = "airtable-pat"
pattern = "pat[a-zA-Z0-9]{14}\\.[a-f0-9]{64}"
[[rule]]
id = "postman-api-token"
pattern = "PMAK-[a-f0-9]{24}-[a-f0-9]{34}"
[[rule]]
id = "grafana-service-account-token"
pattern = "glsa_[A-Za-z0-9]{32}_[a-f0-9]{8}"
[[rule]]
id = "grafana-cloud-api-token"

[[rule]]
id = "slack-app-token"
pattern = "xapp-[0-9]-[A-Z0-9]{11}-[0-9]{13}-[a-z0-9]{64}"
[[rule]]
id = "slack-webhook-url"
pattern = "https://hooks\\.slack\\.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{43,56}"
[[rule]]
id = "stripe-secret-key"
pattern = "(?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{24,99}"
[[rule]]
id = "square-access-token"
pattern = "(?:EAAA|sq0atp-)[0-9A-Za-z_-]{22,60}"
[[rule]]
id = "sendgrid-api-token"
pattern = "SG\\.[a-zA-Z0-9=_.-]{66}"
[[rule]]
id = "sendinblue-api-token"
pattern = "xkeysib-[a-f0-9]{64}-[a-zA-Z0-9]{16}"
[[rule]]
id = "mailgun-private-api-token"

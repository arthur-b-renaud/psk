[[rule]]
id = "hashicorp-vault-batch-token"
pattern = "hvb\\.[0-9A-Za-z_-]{138,200}"
[[rule]]
id = "hashicorp-tf-api-token"
pattern = "[a-z0-9]{14}\\.atlasv1\\.[a-z0-9_=-]{60,70}"
[[rule]]
id = "pulumi-api-token"

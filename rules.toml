# Token rules: `pattern` is a restricted regex subset that is BOTH the detector
# and the fixture generator (literals, escapes, [classes]{n,m}, (?:a|b), ?).
# Curated from gitleaks (MIT) and secrets-patterns-db; prefix-anchored rules only.

[[rule]]
id = "anthropic-api-key"
pattern = "sk-ant-api03-[a-zA-Z0-9_-]{93}AA"
[[rule]]
id = "anthropic-admin-api-key"
pattern = "sk-ant-admin01-[a-zA-Z0-9_-]{93}AA"
[[rule]]
id = "openai-api-key"
pattern = "sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{58}T3BlbkFJ[A-Za-z0-9_-]{58}"
[[rule]]
id = "openai-legacy-api-key"
pattern = "sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20}"
[[rule]]
id = "perplexity-api-key"
pattern = "pplx-[a-zA-Z0-9]{48}"
[[rule]]
id = "huggingface-access-token"
pattern = "hf_[a-zA-Z]{34}"
[[rule]]
id = "huggingface-org-token"
pattern = "api_org_[a-zA-Z]{34}"
[[rule]]
id = "aws-access-key-id"
pattern = "(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}"
[[rule]]
id = "aws-bedrock-api-key"
pattern = "ABSK[A-Za-z0-9+/]{109,140}={0,2}"
[[rule]]
id = "gcp-api-key"
pattern = "AIza[0-9A-Za-z_-]{35}"
[[rule]]
id = "azure-ad-client-secret"
pattern = "[a-zA-Z0-9_~.]{3}[0-9]Q~[a-zA-Z0-9_~.-]{31,34}"
[[rule]]
id = "alibaba-access-key-id"
pattern = "LTAI[a-zA-Z0-9]{20}"
[[rule]]
id = "github-pat"
pattern = "ghp_[0-9a-zA-Z]{36}"
[[rule]]
id = "github-oauth"
pattern = "gho_[0-9a-zA-Z]{36}"
[[rule]]
id = "github-app-token"
pattern = "(?:ghu|ghs)_[0-9a-zA-Z]{36}"
[[rule]]
id = "github-refresh-token"
pattern = "ghr_[0-9a-zA-Z]{36}"
[[rule]]
id = "github-fine-grained-pat"
pattern = "github_pat_[0-9a-zA-Z_]{82}"
[[rule]]
id = "gitlab-pat"
pattern = "glpat-[0-9a-zA-Z_-]{20}"
[[rule]]
id = "gitlab-pat-routable"
pattern = "glpat-[0-9a-zA-Z_-]{27,60}\\.[0-9a-z]{9}"
[[rule]]
id = "gitlab-deploy-token"
pattern = "gldt-[0-9a-zA-Z_-]{20}"
[[rule]]
id = "gitlab-runner-token"
pattern = "glrt-[0-9a-zA-Z_-]{20}"
[[rule]]
id = "gitlab-oauth-app-secret"
pattern = "gloas-[0-9a-zA-Z_-]{64}"
[[rule]]
id = "gitlab-ptt"
pattern = "glptt-[0-9a-f]{40}"
[[rule]]
id = "gitlab-agent-token"
pattern = "glagent-[0-9a-zA-Z_-]{50}"
[[rule]]
id = "npm-access-token"
pattern = "npm_[a-zA-Z0-9]{36}"
[[rule]]
id = "pypi-upload-token"
pattern = "pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,120}"
[[rule]]
id = "rubygems-api-token"
pattern = "rubygems_[a-f0-9]{48}"
[[rule]]
id = "slack-bot-token"
pattern = "xoxb-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"
[[rule]]
id = "slack-user-token"

[[rule]]
id = "flyio-access-token"
pattern = "fo1_[0-9A-Za-z_-]{43}"
[[rule]]
id = "heroku-api-key-v2"
pattern = "HRKU-AA[0-9a-zA-Z_-]{58}"
[[rule]]
id = "octopus-deploy-api-key"
pattern = "API-[A-Z0-9]{26}"
[[rule]]
id = "artifactory-api-key"
pattern = "AKCp[A-Za-z0-9]{69}"
[[rule]]
id = "clojars-api-token"
pattern = "CLOJARS_[a-z0-9]{60}"
[[rule]]
id = "cloudflare-origin-ca-key"
pattern = "v1\\.0-[a-f0-9]{24}-[a-f0-9]{146}"
[[rule]]
id = "1password-secret-key"
pattern = "A3-[A-Z0-9]{6}-[A-Z0-9]{6}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}"
[[rule]]
id = "age-secret-key"
pattern = "AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}"
[[rule]]
id = "openshift-user-token"
pattern = "sha256~[0-9A-Za-z_-]{43}"
[[rule]]
id = "facebook-page-access-token"
pattern = "EAA[MC][a-zA-Z0-9]{100,160}"
[[rule]]
id = "jwt"
pattern = "eyJ[a-zA-Z0-9]{17,60}\\.eyJ[a-zA-Z0-9_-]{17,200}\\.[a-zA-Z0-9_-]{10,86}"
[[rule]]
id = "private-key-block"
pattern = "-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY(?: BLOCK)?-----"
[[rule]]
id = "us-ssn"
pattern = "(?:[0-8][0-9]{2})-(?:[0-9]{2})-(?:[0-9]{4})"

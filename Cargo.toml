[workspace]
resolver = "3"
members = [
    "crates/psk-vault",
    "crates/psk-secrets",
    "crates/psk-verifiers",
    "crates/psk-core",
    "crates/psk-proxy",
    "crates/psk-init",
    "crates/psk-tui",
    "crates/psk-cli",
]

# Inherited by every crate via `version.workspace = true` etc., so metadata is
# declared once instead of eight times.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/arthur-b-renaud/psk"
rust-version = "1.85"

# One version per dependency for the whole workspace. Crates opt in with
# `foo.workspace = true`, so two crates can never disagree on a version.
[workspace.dependencies]
aho-corasick = "1"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["stream", "http2", "rustls", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
zeroize = { version = "1", features = ["zeroize_derive"] }

[profile.release]
lto = "thin"
strip = true

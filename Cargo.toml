[workspace]
members = [
    "crates/psk-core",
    "crates/psk-patterns",
    "crates/psk-pii-ml",
    "crates/psk-proxy",
    "crates/psk-hook",
    "crates/psk-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/psk-ai/psk"
description = "Prompt Secret Killer — scrub PII and secrets from LLM prompts before they leave your machine"

[workspace.dependencies]
psk-core = { path = "crates/psk-core" }
psk-patterns = { path = "crates/psk-patterns" }
psk-pii-ml = { path = "crates/psk-pii-ml" }
psk-proxy = { path = "crates/psk-proxy" }
psk-hook = { path = "crates/psk-hook" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Regex
regex = "1"
aho-corasick = "1"

# Validation
luhn3 = "1"
iban_validate = "4"
card-validate = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Utils
once_cell = "1"
dirs = "5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
